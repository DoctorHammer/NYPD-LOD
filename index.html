            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .media-canvas video {
            width: 100%;
            height: 100%;
        }
        .placeholder-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        .media-canvas.has-media .placeholder-info {
            display: none !important;
        }
        .tweet-container {
            width: 100%;
            max-width: none;
            padding: 0;
            margin: 0 auto;
        }
        .tweet-container .twitter-tweet {
            margin: 0 auto !important;
        }
        .tweet-container iframe {
            width: 100% !important;

        }
        .btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            border-radius: 9999px;
            padding: 0.875rem 2rem;
            font-size: 1.1rem;
            text-align: center;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.03);
        }
        .btn:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-download, .btn-copy, .btn-see {
            background: #334155;
            color: #e2e8f0;
            box-shadow: 0 8px 20px rgba(51, 65, 85, 0.4);
        }

            background: linear-gradient(to right, #D4AF37, #fbbf24);

        const idx = lunr(function () {
            this.ref('id');
            this.field('officer');
            this.field('tags');
            this.field('captionTemplate');
            this.field('dateFormatted');

            data.forEach((doc, i) => {
                const [y, m, d] = doc.dateOfDeath.split('-');
                const monthNames = ["January", "February", "March", "April", "May", "June",
                                    "July", "August", "September", "October", "November", "December"];
                const monthName = monthNames[parseInt(m, 10) - 1];
                const day = parseInt(d, 10);
                
                doc.dateFormatted = `${monthName} ${day}, ${y}`;
                
                doc.id = i;
                this.add(doc);
            });
        });

        function ordinal(n) {
            if (n <= 0) return '';
            const lastTwo = n % 100;
            if (lastTwo >= 11 && lastTwo <= 13) {
                return n + 'th';
            }
            const lastDigit = n % 10;
            switch (lastDigit) {
                case 1: return n + 'st';
                case 2: return n + 'nd';
                case 3: return n + 'rd';
                default: return n + 'th';
            }
        }

        function pluralize(word, count) {
            return count === 1 ? word : word + 's';
        }

        function getAnniversaryText(dodStr) {
            const [deathYear, deathMonth, deathDay] = dodStr.split('-').map(Number);

            // Determine next anniversary year
            let nextAnnivYear = today.getFullYear();
            if (today.getMonth() + 1 > deathMonth || 
                (today.getMonth() + 1 === deathMonth && today.getDate() > deathDay)) {
                nextAnnivYear++;
            }

            const annivNumber = nextAnnivYear - deathYear;

            // Create next anniversary date, handling February 29 in non-leap years
            let nextAnnivMonth = deathMonth;
            let nextAnnivDay = deathDay;

            if (deathMonth === 2 && deathDay === 29) {
                // Check if nextAnnivYear is a leap year
                const isLeap = (nextAnnivYear % 4 === 0 && (nextAnnivYear % 100 !== 0 || nextAnnivYear % 400 === 0));
                if (!isLeap) {
                    nextAnnivDay = 28;  // Standard practice: Feb 28 for anniversaries
                    // Alternative: nextAnnivMonth = 3; nextAnnivDay = 1; // March 1
                }
            }

            const nextAnniv = new Date(nextAnnivYear, nextAnnivMonth - 1, nextAnnivDay);

            const deltaMs = nextAnniv.getTime() - today.getTime();
            const daysUntil = Math.ceil(deltaMs / (1000 * 60 * 60 * 24));  // ceil for precision

            if (daysUntil === 0) {
                return `Today is the ${ordinal(annivNumber)} anniversary`;
            }

            // Approximate months and remaining days
            let months = (nextAnniv.getFullYear() - today.getFullYear()) * 12 +
                         (nextAnniv.getMonth() - today.getMonth());

            let days = nextAnniv.getDate() - today.getDate();
            if (days < 0) {
                months--;
                // Days in the previous month
                const prevMonthDate = new Date(nextAnniv.getFullYear(), nextAnniv.getMonth(), 0);
                days += prevMonthDate.getDate();
            }

            // Adjust if negative months (shouldn't happen but safety)
            if (months < 0) months = 0;

            let text = '';
            if (months > 0) {
                text += `${months} ${pluralize('month', months)} `;
            }
            text += `${days} ${pluralize('day', days)} `;
            text += `till ${ordinal(annivNumber)} anniversary`;

            return text.trim();
        }

        function formatEOW(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${m}/${d}/${y}`;
        }

        function getMediaPath(officer) {
            const date = officer.dateOfDeath.replace(/-/g, '');
            const mmddyy = date.slice(4) + date.slice(2,4);
            return `files/pictures/${officer.lastName.toLowerCase()}${mmddyy}`;
        }

        function getTweetId(link) {
            const match = link?.match(/status\/(\d+)/);
            return match ? match[1] : null;
        }

        function renderOfficerCard(officer) {
            const annivText = getAnniversaryText(officer.dateOfDeath);
            const updatedCaption = officer.captionTemplate.replace(/\{years\}/g, calculateYears(officer.dateOfDeath));
            const mediaBasePath = getMediaPath(officer);
            const photoPath = mediaBasePath + '.jpg';
            const videoPath = mediaBasePath + '.mp4';
            const tweetId = getTweetId(officer.exampleTweetLink);

            const card = document.createElement('div');
            card.className = 'card p-10';

            card.innerHTML = `
                <h2 class="text-4xl font-bold text-nypd-gold mb-4">${officer.officer}</h2>
                <p class="text-2xl text-slate-300 mb-10">End of Watch: ${formatEOW(officer.dateOfDeath)} | ${annivText}</p>

                <div class="grid lg:grid-cols-2 gap-10 mb-10 items-start">
                    <!-- Left: Media -->
                    <div class="flex flex-col items-center">
                        <div class="media-canvas w-full relative">
                            <video 
                                src="${videoPath}" 
                                autoplay loop muted playsinline 
                                class="w-full h-full object-contain rounded-2xl shadow-2xl z-10 absolute inset-0" 
                                onerror="this.style.display='none';"
                                onload="this.style.display='block'; 
                                         if (this.previousElementSibling) this.previousElementSibling.style.display='none'; 
                                         this.parentElement.classList.add('has-media');">
                            </video>
                            
                            <img 
                                src="${photoPath}" 
                                class="w-full h-full object-contain rounded-2xl shadow-2xl z-10" 
                                onerror="this.style.display='none';"
                                onload="this.style.display='block'; 
                                         const video = this.previousElementSibling;
                                         if (video && video.videoWidth > 0) this.style.display='none';
                                         this.parentElement.classList.add('has-media');">
                            
                            <div class="placeholder-info flex flex-col items-center justify-center h-full">
                                <strong class="text-2xl mb-2">(Media Loading)</strong>
                                <p class="mb-1">Checking files/pictures for:</p>
                                <code>${officer.lastName.toLowerCase()}${officer.dateOfDeath.replace(/-/g,'').slice(4)}${officer.dateOfDeath.slice(2,4)}.jpg or .mp4</code>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Tweet -->
                    <div class="tweet-container">
                        ${tweetId ? `<blockquote class="twitter-tweet" data-dnt="true" data-theme="dark"><a href="https://twitter.com/NYPDnews/status/${tweetId}"></a></blockquote>` : '<p class="text-slate-500 text-center text-xl">Tweet Preview</p>'}
                    </div>
                </div>

                <!-- Buttons -->
                <div class="grid lg:grid-cols-4 gap-8 max-w-5xl mx-auto">
                    <div class="flex justify-center">
                        <a href="${videoPath}" download class="btn btn-download py-4 px-10 text-lg w-full max-w-xs text-center">
                            Download Video
                        </a>
                    </div>
                    <div class="flex justify-center">
                        <a href="${photoPath}" download class="btn btn-download py-4 px-10 text-lg w-full max-w-xs text-center">
                            Download Image
                        </a>
                    </div>
                    <div class="flex justify-center">
                        <button class="btn btn-copy py-4 px-10 text-lg w-full max-w-xs text-center">
                            Copy Caption
                        </button>
                    </div>
                    ${officer.exampleTweetLink ? `
                    <div class="flex justify-center">
                        <a href="${officer.exampleTweetLink}" target="_blank" class="btn btn-see py-4 px-10 text-lg w-full max-w-xs text-center">
                            See Post
                        </a>
                    </div>` : '<div></div>'}
                </div>
            `;

            card.querySelector('.btn-copy')?.addEventListener('click', () => {
                navigator.clipboard.writeText(updatedCaption);
            });

            return card;
        }

        function calculateYears(dod) {
            const [deathYear, deathMonth, deathDay] = dod.split('-').map(Number);
            let years = today.getFullYear() - deathYear;
            if (today.getMonth() + 1 < deathMonth || (today.getMonth() + 1 === deathMonth && today.getDate() < deathDay)) {
                years--;
            }
            return years;
        }

        function displayTodayAndUpcoming() {
            const todayMonth = today.getMonth() + 1;
            const todayDay = today.getDate();

            const todayOfficers = data.filter(officer => {
                let [ , m, d ] = officer.dateOfDeath.split('-').map(Number);
                // Handle Feb 29: if today is Feb 28 in non-leap and death was Feb 29
                if (m === 2 && d === 29) {
                    const deathYear = parseInt(officer.dateOfDeath.split('-')[0]);
                    const wasLeap = (deathYear % 4 === 0 && (deathYear % 100 !== 0 || deathYear % 400 === 0));
                    if (!wasLeap) return false; // Invalid historical date, skip
                    const isTodayLeap = (today.getFullYear() % 4 === 0 && (today.getFullYear() % 100 !== 0 || today.getFullYear() % 400 === 0));
                    if (!isTodayLeap && todayMonth === 2 && todayDay === 28) {
                        return true; // Treat Feb 28 as anniversary if death was Feb 29
                    }
                }
                return m === todayMonth && d === todayDay;
            });

            const todayContainer = document.getElementById('today-section');
            todayContainer.innerHTML = '<h2 class="text-4xl font-bold text-nypd-gold mb-8 text-center">Today\'s LODD</h2>';

            if (todayOfficers.length > 0) {
                const grid = document.createElement('div');
                grid.className = 'grid gap-20 mb-16';
                todayOfficers.forEach(officer => {
                    const card = renderOfficerCard(officer);
                    grid.appendChild(card);
                });
                todayContainer.appendChild(grid);
                if (typeof twttr !== 'undefined') twttr.widgets.load();
            } else {
                todayContainer.innerHTML += '<p class="text-center text-slate-400 text-2xl">No anniversaries today.</p>';
            }
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = '';
            if (results.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 text-2xl">No results found.</p>';
                return;
            }

            results.forEach(res => {
                const officer = data[res.ref];
                const card = renderOfficerCard(officer);
                container.appendChild(card);
            });

            if (typeof twttr !== 'undefined') twttr.widgets.load();
        }

        document.getElementById('search').addEventListener('input', e => {
            const query = e.target.value.trim();
            if (query === '') {
                renderResults(data.map((_, i) => ({ ref: i })));
            } else {
                renderResults(idx.search(query + '*'));
            }
        });

        displayTodayAndUpcoming();
        renderResults(data.map((_, i) => ({ ref: i })));
    </script>
